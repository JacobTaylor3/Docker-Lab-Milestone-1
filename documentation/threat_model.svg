<svg xmlns="http://www.w3.org/2000/svg" width="860" viewBox="0 0 680 472">
<title>Milestone 2 threat model — hosts, hops, trust zones</title>
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; }
  .th  { font-size: 14px; font-weight: 500; }
  .ts  { font-size: 12px; font-weight: 400; }
  .c-coral rect  { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral .th   { fill: #712B13; }
  .c-coral .ts   { fill: #993C1D; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .th  { fill: #3C3489; }
  .c-purple .ts  { fill: #534AB7; }
  .c-teal rect   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal .th    { fill: #085041; }
  .c-teal .ts    { fill: #0F6E56; }
  .c-gray rect   { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th    { fill: #444441; }
  .c-gray .ts    { fill: #5F5E5A; }
  .c-blue rect   { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .c-blue .th    { fill: #0C447C; }
  .c-blue .ts    { fill: #185FA5; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- background -->
<rect width="680" height="472" fill="#ffffff"/>

<!-- ─── TRUST ZONES ─── -->
<rect x="10" y="35" width="182" height="390" rx="10" fill="#FAEEDA" fill-opacity="0.35" stroke="#E4AA4A" stroke-width="0.5" stroke-dasharray="7 4"/>
<text class="ts" x="101" y="27" text-anchor="middle" fill="#BA7517">Attacker infrastructure</text>

<rect x="205" y="58" width="215" height="365" rx="10" fill="#F1EFE8" fill-opacity="0.5" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="7 4"/>
<text class="ts" x="312" y="50" text-anchor="middle" fill="#5F5E5A">Frontnet (DMZ)</text>

<rect x="430" y="108" width="208" height="292" rx="10" fill="#E6F1FB" fill-opacity="0.4" stroke="#85B7EB" stroke-width="0.5" stroke-dasharray="7 4"/>
<text class="ts" x="534" y="100" text-anchor="middle" fill="#378ADD">Victim machine</text>

<!-- ─── ATTACKER ZONE NODES ─── -->
<g class="c-coral">
  <rect x="25" y="55" width="152" height="44" rx="6"/>
  <text class="th" x="101" y="69" text-anchor="middle" dominant-baseline="central">Operator</text>
  <text class="ts" x="101" y="85" text-anchor="middle" dominant-baseline="central">linux host</text>
</g>

<g class="c-purple">
  <rect x="25" y="178" width="152" height="44" rx="6"/>
  <text class="th" x="101" y="192" text-anchor="middle" dominant-baseline="central">C2 server</text>
  <text class="ts" x="101" y="208" text-anchor="middle" dominant-baseline="central">backnet only</text>
</g>

<g class="c-purple">
  <rect x="25" y="355" width="152" height="44" rx="6"/>
  <text class="th" x="101" y="369" text-anchor="middle" dominant-baseline="central">Exfil receiver</text>
  <text class="ts" x="101" y="385" text-anchor="middle" dominant-baseline="central">exfilnet only</text>
</g>

<!-- ─── FRONTNET NODES ─── -->
<g class="c-gray">
  <rect x="218" y="80" width="178" height="44" rx="6"/>
  <text class="th" x="307" y="94" text-anchor="middle" dominant-baseline="central">Exploit server</text>
  <text class="ts" x="307" y="110" text-anchor="middle" dominant-baseline="central">CVE-2021-21220 · :8888</text>
</g>

<g class="c-gray">
  <rect x="218" y="155" width="178" height="44" rx="6"/>
  <text class="th" x="307" y="169" text-anchor="middle" dominant-baseline="central">Delivery server</text>
  <text class="ts" x="307" y="185" text-anchor="middle" dominant-baseline="central">single-use token · :8443</text>
</g>

<g class="c-teal">
  <rect x="218" y="265" width="178" height="44" rx="6"/>
  <text class="th" x="307" y="279" text-anchor="middle" dominant-baseline="central">C2 redirector</text>
  <text class="ts" x="307" y="295" text-anchor="middle" dominant-baseline="central">mTLS relay · :443</text>
</g>

<g class="c-teal">
  <rect x="218" y="370" width="178" height="44" rx="6"/>
  <text class="th" x="307" y="384" text-anchor="middle" dominant-baseline="central">Exfil redirector</text>
  <text class="ts" x="307" y="400" text-anchor="middle" dominant-baseline="central">HTTPS relay · :9443</text>
</g>

<!-- ─── VICTIM NODE ─── -->
<g class="c-blue">
  <rect x="441" y="185" width="175" height="56" rx="6"/>
  <text class="th" x="528" y="205" text-anchor="middle" dominant-baseline="central">Windows 10 victim</text>
  <text class="ts" x="528" y="224" text-anchor="middle" dominant-baseline="central">implant (high integrity)</text>
</g>

<!-- ─── ARROWS ─── -->
<line x1="101" y1="99" x2="101" y2="178" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

<path d="M177,200 L196,200 L196,287 L218,287" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="220" y="228" width="54" height="15" rx="3" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
<text class="ts" x="247" y="239" text-anchor="middle" fill="#085041">mTLS 1.3</text>

<path d="M218,392 L196,392 L196,377 L177,377" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

<!-- T1 amber -->
<path d="M396,102 L430,102 L430,200 L441,200" fill="none" stroke="#BA7517" stroke-width="1.8" marker-end="url(#a)"/>
<!-- T2 green -->
<path d="M396,177 L416,177 L416,215 L441,215" fill="none" stroke="#3B6D11" stroke-width="1.8" marker-end="url(#a)"/>
<!-- T3 teal bidi -->
<path d="M396,287 L422,287 L422,228 L441,228" fill="none" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
<!-- T4 blue -->
<path d="M441,235 L428,235 L428,392 L396,392" fill="none" stroke="#185FA5" stroke-width="1.8" marker-end="url(#a)"/>

<!-- ─── LEGEND ─── -->
<line x1="25" y1="445" x2="635" y2="445" stroke="#D3D1C7" stroke-width="0.5"/>

<rect x="25" y="454" width="8" height="8" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="ts" x="38" y="462" fill="#444441">Operator</text>

<rect x="130" y="454" width="8" height="8" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="143" y="462" fill="#444441">Attacker backend</text>

<rect x="290" y="454" width="8" height="8" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="303" y="462" fill="#444441">Redirector (hop)</text>

<rect x="450" y="454" width="8" height="8" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="463" y="462" fill="#444441">Passive server</text>

<rect x="570" y="454" width="8" height="8" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="583" y="462" fill="#444441">Victim</text>
</svg>
